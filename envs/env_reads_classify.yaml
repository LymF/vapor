name: env_reads_classify
channels:
  - conda-forge
  - bioconda
dependencies:
  # pinados nas mesmas versoes de containers.yaml: sem isso o caminho
  # conda resolve para a versao mais nova do dia e o caminho container
  # roda a pinada, produzindo resultados diferentes no mesmo commit.
  - sylph =0.9.0
  - sylph-tax =1.9.1
  - python >=3.9
  - pandas >=1.5
  - biopython >=1.80
  - pip:
      - bacphlip  # lifestyle prediction — only used when reads_classify_genome_fasta is set
