name: Build and push custom containers

on:
  push:
    branches: [master]
    paths:
      - "docker/Dockerfile.genome-map"
      - "docker/Dockerfile.medaka-gpu"
  pull_request:
    paths:
      - "containers.yaml"
      - "containers.lock.yaml"
      - "scripts/pin_containers.py"
      - "scripts/check_env_container_sync.py"
      - "envs/**"
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # Guarda o lock alinhado com containers.yaml. Sem isso o lock silenciosamente
  # envelhece: uma versao bumpada no containers.yaml continuaria rodando a
  # imagem antiga, ou -- se o lock sumir -- todo `container:` volta a resolver
  # para None e a pipeline cai para conda sem avisar.
  check-lock:
    name: containers em dia (lock + sincronia com os envs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Verificar lock contra containers.yaml
        run: python3 scripts/pin_containers.py --check
      - name: Verificar que conda e container pinam a mesma versao
        run: python3 scripts/check_env_container_sync.py --check

  genome-map:
    name: genome-map image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from Dockerfile
        id: meta
        run: |
          VERSION=$(grep 'image.version' docker/Dockerfile.genome-map | grep -oP '"\K[^"]+')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/vapor-genome-map"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.genome-map
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
