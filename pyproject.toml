[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vapor-pipeline"
version = "1.3.0"
description = "VAPOR — Viral And Prokaryotic mOdular pipelineR"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.scripts]
vapor = "vapor:main"

[tool.setuptools]
py-modules = ["vapor", "pipeline_config", "coassembly_groups"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["Snakefile", "config.yaml", "rules/*.smk", "scripts/*.py", "envs/*.yaml", "containers.yaml"]
