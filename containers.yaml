# containers.yaml — VAPOR container definitions
#
# Each entry maps a pipeline key to the tool's bioconda package name and version.
# Run once to resolve exact quay.io tags and generate containers.lock.yaml:
#
#   python3 scripts/pin_containers.py
#   python3 scripts/pin_containers.py --check   # verify existing lock
#
# Rules use CONTAINERS.get("key") loaded from containers.lock.yaml.
# If the lock file is absent, all container: directives resolve to null
# and Snakemake falls back to --use-conda automatically.
#
# GPU-capable tools (medaka, comebin) have optional GPU Dockerfiles
# in docker/. Build and push them to GHCR before using --use-gpu.

# ── QC ─────────────────────────────────────────────────────────────────
