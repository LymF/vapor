# containers.yaml — VAPOR container definitions
#
# Each entry maps a pipeline key to the tool's bioconda package name and version.
# Run once to resolve exact quay.io tags and generate containers.lock.yaml:
#
#   python3 scripts/pin_containers.py
#   python3 scripts/pin_containers.py --check   # verify existing lock
#
# Rules use CONTAINERS.get("key") loaded from containers.lock.yaml.
# If the lock file is absent, all container: directives resolve to null
# and Snakemake falls back to --use-conda automatically.
#
# GPU-capable tools (medaka) have optional GPU Dockerfiles
# in docker/. Build and push them to GHCR before using --use-gpu.

# ── QC ─────────────────────────────────────────────────────────────────
fastp:
  image: fastp
  # alinhado a envs/env_qc.yaml (fastp=1.3.3). env_qc e um env resolvido:
  # subir a versao aqui sem re-resolver o env faria os dois caminhos de
  # execucao rodarem fastp diferentes.
  version: "1.3.3"

cutadapt:
  # QC alternativo TEMPORARIO por amostra (qc_cutadapt_samples), alinhado a
  # envs/env_cutadapt.yaml. Sem esta entrada a regra ficaria com
  # container: None e, sob `--executor apptainer`, rodaria no host -- onde o
  # cutadapt nao existe.
  image: cutadapt
  version: "5.0"

quast:
  image: quast
  version: "5.3.0"

multiqc:
  image: multiqc
  version: "1.33"

